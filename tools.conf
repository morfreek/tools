# Configuración del proxy para la API (debe ir primero)
<Location "/tools/api/">
    # Configuración básica del proxy
    ProxyPreserveHost On
    ProxyPass http://localhost:3001/tools/api/
    ProxyPassReverse http://localhost:3001/tools/api/

    # Headers adicionales para el proxy
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-SSL "on"
    RequestHeader set X-Forwarded-Port "443"

    # Asegurar que todas las peticiones lleguen al backend
    RewriteEngine Off
    Options -MultiViews
    
    # Permitir todos los métodos HTTP necesarios
    <Limit GET POST PUT DELETE OPTIONS>
        Require all granted
    </Limit>
</Location>

# Configuración para el frontend
Alias /tools /var/www/html/private/apps/tools/dist

<Directory "/var/www/html/private/apps/tools/dist">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
    
    # Reglas para Single Page Application
    RewriteEngine On
    RewriteBase /tools/
    # No reescribir peticiones a la API
    RewriteCond %{REQUEST_URI} !^/tools/api/ [NC]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ index.html [QSA,L]
</Directory>
